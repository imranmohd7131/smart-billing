<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Billing - SmartBilling</title>
</head>
<body>

<div th:replace="~{layout :: layout('🧾 Billing &amp; Sales', ~{::main-content})}">
    <th:block th:ref="main-content">

        <div th:if="${success}" class="alert-modern alert-success-modern" role="status"><span>✅</span> <span th:text="${success}"></span></div>
        <div th:if="${error}" class="alert-modern alert-danger-modern" role="alert"><span>❌</span> <span th:text="${error}"></span></div>

        <div class="workspace-grid" style="display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;">

            <!-- New Sale Form -->
            <div class="card-modern" style="padding:22px;">
                <div style="font-weight:700;color:#0f172a;font-size:14px;margin-bottom:18px;">🛒 New Sale</div>
                <form th:action="@{/billing/sell}" method="post">
                    <div style="margin-bottom:14px;">
                        <label for="saleBranch" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Branch</label>
                        <select id="saleBranch" name="branchId" class="form-control-modern" required
                                onchange="window.location='/billing?branchId='+this.value">
                            <option value="">-- Select Branch --</option>
                            <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"
                                    th:selected="${b.id == selectedBranch}"></option>
                        </select>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label for="saleProduct" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Product</label>
                        <select id="saleProduct" name="productId" class="form-control-modern" required>
                            <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label for="customerName" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Customer Name <span style="color:#94a3b8;font-weight:400;">(optional)</span></label>
                        <input id="customerName" type="text" name="customerName" class="form-control-modern" placeholder="Walk-in customer">
                    </div>
                    <div style="margin-bottom:18px;">
                        <label for="saleQuantity" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Quantity</label>
                        <input id="saleQuantity" type="number" name="quantity" class="form-control-modern" min="1" placeholder="Enter quantity" required>
                    </div>
                    <button type="submit" class="btn-success-modern" style="width:100%;">Generate Bill ✓</button>
                </form>
            </div>

            <!-- Sales History -->
            <div class="card-modern" style="padding:22px;">
                <div th:if="${sales != null}" style="font-weight:700;color:#0f172a;font-size:14px;margin-bottom:16px;">
                    📋 Sales History
                    <span style="background:#f1f5f9;color:#64748b;padding:2px 10px;border-radius:12px;font-size:12px;margin-left:8px;" th:text="${#lists.size(sales)} + ' records'"></span>
                </div>
                <div class="table-wrap" tabindex="0" role="region" aria-label="Sales history" th:if="${sales != null}">
                <table class="table-modern">
                    <thead>
                        <tr><th>#</th><th>Customer</th><th>Product</th><th>Qty</th><th>Amount</th><th>Date &amp; Time</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="sale, i : ${sales}">
                            <td style="color:#94a3b8;" th:text="${i.count}"></td>
                            <td style="font-weight:600;" th:text="${sale.customerName != null and !sale.customerName.isEmpty() ? sale.customerName : 'Walk-in'}"></td>
                            <td th:text="${sale.product.name}"></td>
                            <td th:text="${sale.quantity}"></td>
                            <td style="font-weight:700;color:#10b981;">₹<span th:text="${sale.totalAmount}"></span></td>
                            <td style="color:#94a3b8;font-size:12px;" th:text="${#temporals.format(sale.saleDate, 'dd MMM yyyy, HH:mm')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sales)}">
                            <td colspan="6" style="text-align:center;color:#94a3b8;padding:40px;">No sales yet for this branch.</td>
                        </tr>
                    </tbody>
                </table>
                </div>
                <div th:if="${sales == null}" style="text-align:center;color:#94a3b8;padding:60px 0;">
                    <div style="font-size:40px;margin-bottom:12px;">🧾</div>
                    <div>Select a branch to view sales history</div>
                </div>
            </div>
        </div>

    </th:block>
</div>

</body>
</html>
