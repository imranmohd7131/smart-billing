<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SmartBilling</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 12px; padding: 32px; width: calc(100% - 32px); max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .brand-icon { width: 48px; height: 48px; background: linear-gradient(135deg,#6366f1,#8b5cf6); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .brand-name { font-size: 22px; font-weight: 800; color: #0f172a; }
        .brand-sub { font-size: 12px; color: #94a3b8; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; transition: border .2s, box-shadow .2s; margin-bottom: 16px; }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s; margin-top: 4px; }
        .btn-login:hover { opacity: .9; }
        .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .alert-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .demo-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-top: 20px; font-size: 12px; color: #64748b; }
        .demo-box strong { color: #374151; }
        .demo-row { display: flex; justify-content: space-between; margin-top: 6px; }
        .demo-badge { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; }
        @media (max-width: 420px) {
            .login-card { padding: 24px; }
            .demo-row { align-items: flex-start; gap: 8px; flex-direction: column; }
        }
        :focus-visible { outline: 3px solid #2dd4bf; outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">📦</div>
            <div>
                <div class="brand-name">SmartBilling</div>
                <div class="brand-sub">Multi-Branch Inventory System</div>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">⚠️ Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">✅ Logged out successfully.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" placeholder="Enter username" required autofocus>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter password" required>
            <button type="submit" class="btn-login">Sign In →</button>
        </form>

        <!-- <div class="demo-box">
            <strong>Demo Credentials</strong>
            <div class="demo-row">
                <span>👑 Owner (full access)</span>
                <span class="demo-badge">owner / owner123</span>
            </div>
            <div class="demo-row" style="margin-top:4px;">
                <span>👤 Staff (sell only)</span>
                <span class="demo-badge">staff / staff123</span>
            </div>
        </div> -->
    </div>
</body>
</html>
