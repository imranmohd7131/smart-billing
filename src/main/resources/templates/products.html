<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products - SmartBilling</title>
</head>
<body>

<div th:replace="~{layout :: layout('🏷️ Products', ~{::main-content})}">
    <th:block th:ref="main-content">

        <div th:if="${success}" class="alert-modern alert-success-modern" role="status"><span>✅</span> <span th:text="${success}"></span></div>

        <div class="workspace-grid" style="display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;">

            <!-- Add Product Form -->
            <div class="card-modern" style="padding:22px;">
                <div style="font-weight:700;color:#0f172a;font-size:14px;margin-bottom:18px;">🏷️ Add New Product</div>
                <form th:action="@{/products/add}" method="post">
                    <div style="margin-bottom:14px;">
                        <label for="productName" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Product Name</label>
                        <input id="productName" type="text" name="name" class="form-control-modern" placeholder='e.g. Samsung TV 55"' required>
                    </div>
                    <div style="margin-bottom:14px;">
                        <label for="productCategory" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Category</label>
                        <input id="productCategory" type="text" name="category" class="form-control-modern" placeholder="e.g. Electronics" required>
                    </div>
                    <div style="margin-bottom:18px;">
                        <label for="productPrice" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Unit Price (₹)</label>
                        <input id="productPrice" type="number" name="price" class="form-control-modern" placeholder="e.g. 28000" min="0" step="0.01" required>
                    </div>
                    <button type="submit" class="btn-primary-modern" style="width:100%;">Add Product</button>
                </form>
            </div>

            <!-- Products List -->
            <div class="card-modern" style="padding:22px;">
                <div style="font-weight:700;color:#0f172a;font-size:14px;margin-bottom:16px;">
                    All Products
                    <span style="background:#f1f5f9;color:#64748b;padding:2px 10px;border-radius:12px;font-size:12px;margin-left:8px;" th:text="${#lists.size(products)} + ' products'"></span>
                </div>
                <div class="table-wrap" tabindex="0" role="region" aria-label="Product list">
                <table class="table-modern">
                    <thead>
                        <tr><th>#</th><th>Product Name</th><th>Category</th><th>Unit Price</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p, i : ${products}">
                            <td style="color:#94a3b8;" th:text="${i.count}"></td>
                            <td style="font-weight:600;color:#0f172a;" th:text="${p.name}"></td>
                            <td><span class="badge-modern badge-gray" th:text="${p.category}"></span></td>
                            <td style="font-weight:700;color:#6366f1;">₹<span th:text="${p.price}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="4" style="text-align:center;color:#94a3b8;padding:40px;">No products added yet.</td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>

    </th:block>
</div>

</body>
</html>
