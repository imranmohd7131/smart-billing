<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory - SmartBilling</title>
</head>
<body>

<div th:replace="~{layout :: layout('📦 Inventory Management', ~{::main-content})}">
    <th:block th:ref="main-content">

        <div th:if="${success}" class="alert-modern alert-success-modern" role="status"><span>✅</span> <span th:text="${success}"></span></div>
        <div th:if="${error}" class="alert-modern alert-danger-modern" role="alert"><span>❌</span> <span th:text="${error}"></span></div>

        <!-- Branch Selector -->
        <div class="card-modern" style="padding:20px;margin-bottom:20px;">
                <label for="inventoryBranch" style="display:block;font-weight:700;color:#0f172a;font-size:13px;margin-bottom:12px;">Select Branch / Godown</label>
            <form method="get" action="/inventory" style="display:flex;gap:12px;align-items:center;">
                <select id="inventoryBranch" name="branchId" class="form-control-modern" style="max-width:280px;" onchange="this.form.submit()">
                    <option value="">-- Select Branch --</option>
                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"
                            th:selected="${b.id == selectedBranch}"></option>
                </select>
            </form>
        </div>

        <!-- Add Stock (Owner only) -->
        <div sec:authorize="hasRole('OWNER')" th:if="${selectedBranch != null}" class="card-modern" style="padding:20px;margin-bottom:20px;">
            <div style="font-weight:700;color:#0f172a;font-size:13px;margin-bottom:14px;">➕ Add / Restock Item</div>
            <form th:action="@{/inventory/add}" method="post" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
                <input type="hidden" name="branchId" th:value="${selectedBranch}">
                <div>
                    <label for="stockProduct" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Product</label>
                    <select id="stockProduct" name="productId" class="form-control-modern" style="min-width:220px;" required>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div>
                    <label for="stockQuantity" style="display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;">Quantity</label>
                    <input id="stockQuantity" type="number" name="quantity" class="form-control-modern" style="width:120px;" min="1" placeholder="e.g. 50" required>
                </div>
                <button type="submit" class="btn-primary-modern">Add Stock</button>
            </form>
        </div>

        <!-- Inventory Table -->
        <div class="card-modern" th:if="${inventory != null}" style="padding:22px;">
            <div style="font-weight:700;color:#0f172a;font-size:13px;margin-bottom:16px;">
                Current Stock
                <span style="background:#f1f5f9;color:#64748b;padding:2px 10px;border-radius:12px;font-size:12px;margin-left:8px;" th:text="${#lists.size(inventory)} + ' items'"></span>
            </div>
            <div class="table-wrap" tabindex="0" role="region" aria-label="Inventory items">
            <table class="table-modern">
                <thead>
                    <tr>
                        <th>#</th><th>Product</th><th>Category</th><th>Unit Price</th><th>Stock</th><th>Status</th>
                        <th sec:authorize="hasRole('OWNER')">Update Qty</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, i : ${inventory}">
                        <td style="color:#94a3b8;" th:text="${i.count}"></td>
                        <td style="font-weight:600;color:#0f172a;" th:text="${item.product.name}"></td>
                        <td><span class="badge-modern badge-gray" th:text="${item.product.category}"></span></td>
                        <td style="color:#6366f1;font-weight:600;">₹<span th:text="${item.product.price}"></span></td>
                        <td style="font-weight:700;font-size:15px;" th:text="${item.quantity}"></td>
                        <td>
                            <span th:if="${item.quantity <= 10}" class="badge-modern badge-danger">Low Stock ⚠️</span>
                            <span th:if="${item.quantity > 10 and item.quantity <= 25}" class="badge-modern badge-warning">Medium</span>
                            <span th:if="${item.quantity > 25}" class="badge-modern badge-success">Good ✓</span>
                        </td>
                        <td sec:authorize="hasRole('OWNER')">
                            <form th:action="@{/inventory/update/{id}(id=${item.id})}" method="post" style="display:flex;gap:6px;align-items:center;">
                                <input type="hidden" name="branchId" th:value="${selectedBranch}">
                                <input type="number" name="quantity" th:value="${item.quantity}" class="form-control-modern" style="width:80px;padding:6px 10px;" min="0" aria-label="Stock quantity">
                                <button type="submit" style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;">Save</button>
                            </form>
                        </td>
                    </tr>
                    <tr sec:authorize="hasRole('OWNER')" th:if="${#lists.isEmpty(inventory)}">
                        <td colspan="7" style="text-align:center;color:#94a3b8;padding:40px;">No inventory found for this branch.</td>
                    </tr>
                    <tr sec:authorize="hasRole('STAFF')" th:if="${#lists.isEmpty(inventory)}">
                        <td colspan="6" style="text-align:center;color:#94a3b8;padding:40px;">No inventory found for this branch.</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>

        <div th:if="${inventory == null}" class="card-modern" style="padding:60px;text-align:center;color:#94a3b8;">
            <div style="font-size:40px;margin-bottom:12px;">🏭</div>
            <div style="font-size:15px;">Select a branch above to view its inventory</div>
        </div>

    </th:block>
</div>

</body>
</html>
